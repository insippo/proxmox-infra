---
# Playbook: Base configuration for Linux VMs
# Scope: Essential packages, timezone, qemu-guest-agent, basic SSH safety
# Target: VMs created via Terraform + cloud-init (SSH access already works)
# Safe to run repeatedly (idempotent) across multiple VMs
# Usage:
#   ansible-playbook -i inventory.yml playbooks/vm-base.yml --limit vms

- name: Base configuration for Linux VMs
  hosts: vms
  become: true
  gather_facts: true

  roles:
    - role: docker
      when: docker_enabled | bool
    - role: prometheus
      when: prometheus_enabled | bool
    - role: grafana
      when: grafana_enabled | bool

  pre_tasks:
    # group_vars only load when Ansible finds them next to the inventory source.
    # If that link is ever broken again, fail here with a clear message instead of
    # a Jinja "'docker_enabled' is undefined" error twenty lines later.
    - name: Assert that group_vars were loaded
      ansible.builtin.assert:
        that:
          - docker_enabled is defined
          - vm_base_packages is defined
          - vm_timezone is defined
        fail_msg: >-
          group_vars were not loaded for {{ inventory_hostname }}. Ansible looks for
          group_vars/ next to the inventory source; check that
          ansible/inventory/group_vars exists (it is a symlink to ../group_vars).
        quiet: true

    - name: Update package cache (keeps installs fast and current)
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 3600
      when: ansible_os_family == "Debian"

  tasks:
    # Install essential base packages
    - name: Install essential base packages
      ansible.builtin.apt:
        name: "{{ vm_base_packages }}"
        state: present
      when: ansible_os_family == "Debian"

    # QEMU Guest Agent (enables Proxmox features like shutdown, IP detection)
    - name: Install qemu-guest-agent
      ansible.builtin.apt:
        name: qemu-guest-agent
        state: present
      when: ansible_os_family == "Debian"

    - name: Ensure qemu-guest-agent service is enabled and running
      ansible.builtin.service:
        name: qemu-guest-agent
        state: started
        enabled: true

    # Timezone configuration
    - name: Set timezone
      community.general.timezone:
        name: "{{ vm_timezone }}"

    # Basic SSH safety (LAN-friendly, not over-hardened).
    #
    # Written as a drop-in rather than by editing sshd_config directly. Debian 12
    # sshd_config opens with "Include /etc/ssh/sshd_config.d/*.conf", cloud-init
    # drops 50-cloud-init.conf in there with PasswordAuthentication yes, and sshd
    # honours the FIRST occurrence of a directive, not the last. Appending to the
    # end of sshd_config therefore lands after the Include and changes nothing,
    # while the task still reports "changed". The 10- prefix sorts ahead of
    # cloud-init's 50-, so these values win.
    - name: Ensure the SSH drop-in directory exists
      ansible.builtin.file:
        path: /etc/ssh/sshd_config.d
        state: directory
        owner: root
        group: root
        mode: '0755'

    - name: Deploy SSH hardening drop-in
      ansible.builtin.copy:
        dest: /etc/ssh/sshd_config.d/10-hardening.conf
        owner: root
        group: root
        mode: '0644'
        backup: true
        validate: "/usr/sbin/sshd -t -f %s"
        content: |
          # Managed by ansible/playbooks/vm-base.yml. Local edits are overwritten.
          PasswordAuthentication no
          PermitRootLogin no
      notify: Restart sshd

    # sshd_config is authoritative only if it actually reads the drop-in directory.
    # A cloned template whose sshd_config predates the Include convention would
    # silently ignore the file written above.
    - name: Verify sshd reads the drop-in directory
      ansible.builtin.command: grep -qE '^\s*Include\s+/etc/ssh/sshd_config\.d/' /etc/ssh/sshd_config
      register: sshd_include_present
      changed_when: false
      failed_when: false

    - name: Fail if the drop-in would be ignored
      ansible.builtin.fail:
        msg: >-
          /etc/ssh/sshd_config on {{ inventory_hostname }} has no Include for
          sshd_config.d, so 10-hardening.conf is not read and SSH is NOT hardened.
          Add "Include /etc/ssh/sshd_config.d/*.conf" near the top of sshd_config.
      when: sshd_include_present.rc != 0

    - name: Ensure SSH service is enabled
      ansible.builtin.service:
        name: ssh
        state: started
        enabled: true

  handlers:
    - name: Restart sshd
      ansible.builtin.service:
        name: ssh
        state: restarted
