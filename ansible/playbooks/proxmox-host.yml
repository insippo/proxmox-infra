# Playbook: Base Proxmox host configuration
# Scope: base OS hardening and utilities only; no storage, no VMs/LXCs.
# Safe to run repeatedly (idempotent) across multiple hosts on LAN-only SSH.
# Usage:
#   ansible-playbook -i inventory.yml playbooks/proxmox-host.yml

- name: Base configuration for Proxmox hosts
  hosts: proxmox_hosts
  become: true
  gather_facts: true

  pre_tasks:
    - name: Update package cache (keeps installs fast and current)
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 3600

    - name: Check for authorized_keys to avoid lockout before hardening
      ansible.builtin.stat:
        path: "{{ authorized_keys_path }}"
      register: authorized_keys_stat

    - name: Stop if no SSH keys are present (prevents locking out)
      ansible.builtin.fail:
        msg: "Add at least one SSH public key to {{ authorized_keys_path }} before applying SSH hardening."
      when: not authorized_keys_stat.stat.exists or authorized_keys_stat.stat.size | default(0) == 0

  roles:
    - role: ssh_keys
    - role: admin_user
      when: admin_user_enabled | bool
    - role: node_exporter
      when: node_exporter_enabled | bool

  tasks:
    - name: Install essential base packages (tooling + time sync + certs)
      ansible.builtin.apt:
        name: "{{ base_packages }}"
        state: present

    - name: Ensure chrony service is enabled and running (time sync)
      ansible.builtin.service:
        name: chrony
        state: started
        enabled: true

    - name: (Optional) Set custom NTP servers for chrony
      ansible.builtin.debug:
        msg: "{{ chrony_note }}"
      # TODO: Add chrony.conf template once NTP sources are defined.

    # Hardening goes in a drop-in, not into sshd_config itself. Debian 12
    # sshd_config starts with "Include /etc/ssh/sshd_config.d/*.conf" and sshd
    # honours the FIRST occurrence of a directive. Appending to the end of
    # sshd_config therefore lands after the Include and has no effect, while the
    # task still reports "changed". The 10- prefix sorts ahead of any vendor or
    # cloud-init drop-in, so these values win.
    #
    # sshd_settings in group_vars remains the single source of truth; this
    # renders it rather than replacing it.
    - name: Ensure the SSH drop-in directory exists
      ansible.builtin.file:
        path: "{{ sshd_config_path | dirname }}/sshd_config.d"
        state: directory
        owner: root
        group: root
        mode: '0755'

    - name: Deploy SSH hardening drop-in
      ansible.builtin.copy:
        dest: "{{ sshd_config_path | dirname }}/sshd_config.d/10-hardening.conf"
        owner: root
        group: root
        mode: '0644'
        backup: true
        # Catches a bad directive before the Restart sshd handler runs and
        # locks everyone out of the host.
        validate: "/usr/sbin/sshd -t -f %s"
        content: |
          # Managed by ansible/playbooks/proxmox-host.yml. Local edits are overwritten.
          {% for item in sshd_settings %}
          {{ item.option }} {{ item.value }}
          {% endfor %}
          {{ sshd_authorized_keys_directive }}
      notify: Restart sshd

    # The drop-in only takes effect if sshd_config actually includes the directory.
    - name: Verify sshd reads the drop-in directory
      ansible.builtin.command: grep -qE '^\s*Include\s+.*sshd_config\.d/' {{ sshd_config_path }}
      register: sshd_include_present
      changed_when: false
      failed_when: false

    - name: Fail if the drop-in would be ignored
      ansible.builtin.fail:
        msg: >-
          {{ sshd_config_path }} on {{ inventory_hostname }} has no Include for
          sshd_config.d, so 10-hardening.conf is not read and SSH is NOT hardened.
          Add "Include /etc/ssh/sshd_config.d/*.conf" near the top of sshd_config.
      when: sshd_include_present.rc != 0

    - name: Ensure SSH service is enabled
      ansible.builtin.service:
        name: ssh
        state: started
        enabled: true

    - name: Apply baseline sysctl settings (network + I/O safety)
      ansible.posix.sysctl:
        name: "{{ item.key }}"
        value: "{{ item.value }}"
        state: present
        reload: true
      loop: "{{ sysctl_settings | dict2items }}"

    - name: Ensure journald persistent storage directory exists
      ansible.builtin.file:
        path: /var/log/journal
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Configure journald for persistent logging
      ansible.builtin.lineinfile:
        path: "{{ journald_conf_path }}"
        regexp: "^Storage="
        line: "Storage={{ journald_storage }}"
        state: present
        create: false
      notify: Restart journald

    - name: (Optional) Tune journald retention
      ansible.builtin.debug:
        msg: "{{ journald_retention_note }}"
      # TODO: Add retention limits when storage policy is defined.

  handlers:
    - name: Restart sshd
      ansible.builtin.service:
        name: ssh
        state: restarted

    - name: Restart journald
      ansible.builtin.service:
        name: systemd-journald
        state: restarted
