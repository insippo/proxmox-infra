# Ansible defaults for this repository.
#
# Run ansible/ansible-lint commands from the ansible/ directory so this file is
# picked up, or export ANSIBLE_CONFIG=<repo>/ansible/ansible.cfg. Without it,
# roles under roles/ do not resolve from playbooks/ and every command depends on
# which directory it happens to be run from.

[defaults]
inventory           = inventory.yml
roles_path          = roles
collections_path    = collections
host_key_checking   = True
retry_files_enabled = False
interpreter_python  = auto_silent
stdout_callback     = yaml

[ssh_connection]
pipelining = True
