---
# Grafana role for monitoring VMs
# Installs and configures Grafana for visualization
# Safe to run repeatedly (idempotent)

- name: Fail fast if the Grafana admin password is unset
  ansible.builtin.fail:
    msg: >-
      grafana_admin_password is empty, so Grafana would keep its built-in
      admin/admin credentials on {{ inventory_hostname }}. Set it from
      ansible-vault before running this role.
  when: grafana_admin_password | length == 0

- name: Install prerequisites for Grafana repository
  ansible.builtin.apt:
    name:
      - apt-transport-https
      - software-properties-common
    state: present
    update_cache: true
  when: ansible_os_family == "Debian"

- name: Add Grafana GPG key
  ansible.builtin.apt_key:
    url: https://apt.grafana.com/gpg.key
    state: present
  when: ansible_os_family == "Debian"
  register: grafana_gpg_key
  until: grafana_gpg_key is succeeded
  retries: 3
  delay: 5

- name: Add Grafana repository
  ansible.builtin.apt_repository:
    repo: "deb https://apt.grafana.com stable main"
    state: present
    update_cache: true
  when: ansible_os_family == "Debian"

- name: Install Grafana package
  ansible.builtin.apt:
    name: grafana
    state: present
    update_cache: true
  when: ansible_os_family == "Debian"
  register: grafana_installed

- name: Create Grafana datasources directory
  ansible.builtin.file:
    path: /etc/grafana/provisioning/datasources
    state: directory
    owner: root
    group: root
    mode: '0755'

- name: Configure Prometheus datasource
  ansible.builtin.copy:
    content: |
      apiVersion: 1
      datasources:
        - name: Prometheus
          type: prometheus
          access: proxy
          url: {{ grafana_prometheus_url }}
          isDefault: true
          editable: true
    dest: /etc/grafana/provisioning/datasources/prometheus.yml
    owner: root
    group: root
    mode: '0644'
  notify: Restart grafana

- name: Create Grafana dashboards directory
  ansible.builtin.file:
    path: /etc/grafana/provisioning/dashboards
    state: directory
    owner: root
    group: root
    mode: '0755'

# An earlier version of this role wrote dashboard JSON into the provisioning
# directory. Grafana reads everything there as a provider config, so any file
# left behind by that version still stops Grafana from starting, no matter how
# correct the rest of this role now is. Remove them.
- name: Find stray dashboard JSON in the provisioning directory
  ansible.builtin.find:
    paths: /etc/grafana/provisioning/dashboards
    patterns: "*.json"
    file_type: file
  register: grafana_stray_provisioning_json

- name: Remove stray dashboard JSON from the provisioning directory
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: absent
  loop: "{{ grafana_stray_provisioning_json.files }}"
  loop_control:
    label: "{{ item.path }}"
  notify: Restart grafana

- name: Create the dashboard content directory
  ansible.builtin.file:
    path: "{{ grafana_dashboards_dest }}"
    state: directory
    owner: root
    group: grafana
    mode: '0750'

- name: Deploy dashboard provisioning configuration
  ansible.builtin.template:
    src: dashboards.yml.j2
    dest: /etc/grafana/provisioning/dashboards/dashboards.yml
    owner: root
    group: grafana
    mode: '0640'
  notify: Restart grafana

- name: Find dashboard JSON files
  ansible.builtin.find:
    paths: "{{ grafana_dashboards_src }}"
    patterns: "*.json"
    file_type: file
  register: grafana_dashboard_files
  delegate_to: localhost
  become: false
  changed_when: false

- name: Deploy dashboard JSON files
  ansible.builtin.copy:
    src: "{{ item.path }}"
    dest: "{{ grafana_dashboards_dest }}/{{ item.path | basename }}"
    owner: root
    group: grafana
    mode: '0640'
  loop: "{{ grafana_dashboard_files.files }}"
  notify: Restart grafana
  when: grafana_dashboard_files.matched > 0

- name: Set the Grafana admin credentials
  ansible.builtin.lineinfile:
    path: /etc/grafana/grafana.ini
    regexp: "^;?{{ item.key }}\\s*="
    line: "{{ item.key }} = {{ item.value }}"
    insertafter: '^\\[security\\]'
    state: present
    owner: root
    group: grafana
    mode: '0640'
  loop:
    - key: admin_user
      value: "{{ grafana_admin_user }}"
    - key: admin_password
      value: "{{ grafana_admin_password }}"
  loop_control:
    label: "{{ item.key }}"
  no_log: true
  notify: Restart grafana

- name: Ensure Grafana service is enabled and running
  ansible.builtin.service:
    name: grafana-server
    state: started
    enabled: true

- name: Verify Grafana is listening on port 3000
  ansible.builtin.wait_for:
    port: 3000
    host: localhost
    delay: 2
    timeout: 10
