---
# Prometheus role for monitoring VMs
# Installs and configures Prometheus for read-only monitoring
# Safe to run repeatedly (idempotent)

- name: Install Prometheus package
  ansible.builtin.apt:
    name: prometheus
    state: present
    update_cache: true
  when: ansible_os_family == "Debian"
  register: prometheus_installed

- name: Create Prometheus configuration directory
  ansible.builtin.file:
    path: /etc/prometheus
    state: directory
    owner: prometheus
    group: prometheus
    mode: '0755'

# Previously this copied monitoring/prometheus/prometheus.yml.example verbatim,
# so every run overwrote the live configuration with placeholder targets
# (proxmox-host-1.example.com and friends) and restarted the service. Prometheus
# came up healthy and scraped nothing. Render real targets from the inventory
# instead, and refuse to install a config promtool rejects.
- name: Deploy Prometheus configuration
  ansible.builtin.template:
    src: prometheus.yml.j2
    dest: /etc/prometheus/prometheus.yml
    owner: prometheus
    group: prometheus
    mode: '0644'
    backup: true
    validate: promtool check config %s
  notify: Restart prometheus

- name: Ensure Prometheus service is enabled and running
  ansible.builtin.service:
    name: prometheus
    state: started
    enabled: true

- name: Verify Prometheus is listening on port 9090
  ansible.builtin.wait_for:
    port: 9090
    host: localhost
    delay: 2
    timeout: 10
