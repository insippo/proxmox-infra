---
# Variables for Linux VMs (created via Terraform + cloud-init)
# These apply to all hosts in the 'vms' group

# Timezone for VMs
vm_timezone: "UTC"

# Base packages to install on all VMs
vm_base_packages:
  - vim
  - curl
  - ca-certificates
  - qemu-guest-agent

# Docker service configuration (optional)
docker_enabled: false  # Set to true to enable Docker on VMs
docker_users: []       # List of users to add to docker group (examples only)

# Monitoring roles are applied to the whole `vms` group, so these flags must stay
# false here. Enabling one group-wide installs that service on EVERY VM in the
# inventory. Turn it on for a single host in host_vars/ instead — see
# host_vars/monitoring_prometheus.yml and host_vars/monitoring_grafana.yml.
prometheus_enabled: false
grafana_enabled: false
