name: CI Quality Gate

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

# No job needs write access; the default token is read-only here.
permissions:
  contents: read

env:
  ANSIBLE_LINT_VERSION: "26.8.0"
  TERRAFORM_VERSION: "1.6.0"
  GITLEAKS_VERSION: "8.28.0"

jobs:
  secret-scan:
    name: Secret Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          # Full history: a secret committed and later deleted is still in the
          # history, which is exactly the case this job exists to catch.
          fetch-depth: 0

      - name: Run gitleaks
        run: |
          curl -sSfL \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz gitleaks
          ./gitleaks detect --source . --redact --verbose --no-banner

  shellcheck:
    name: ShellCheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run shellcheck
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends shellcheck
          shellcheck --version
          # -x follows sourced files so scripts/lib/proxmox.sh is checked in context.
          shellcheck -x -P scripts scripts/*.sh scripts/lib/*.sh

  ansible-lint:
    name: Ansible Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install ansible-lint
        run: pip install "ansible-lint==${ANSIBLE_LINT_VERSION}"

      - name: Install Ansible collections
        # ansible.posix and community.general supply modules the roles call;
        # without them ansible-lint fails at syntax-check.
        run: ansible-galaxy collection install -r ansible/requirements.yml -p ansible/collections

      - name: Run ansible-lint
        # Run from ansible/ so ansible/ansible.cfg applies and roles/ resolves.
        working-directory: ansible
        run: ansible-lint . --nocolor

  terraform-fmt:
    name: Terraform Format Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}

      - name: Check Terraform formatting
        working-directory: terraform
        run: terraform fmt -check -recursive

  terraform-validate:
    name: Terraform Validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}

      - name: Terraform Init (no backend)
        working-directory: terraform
        run: terraform init -backend=false

      - name: Terraform Validate
        working-directory: terraform
        run: terraform validate
